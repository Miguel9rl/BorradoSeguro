; =====================================================================
;  Alamo Seguros - Configuracion del borrado seguro
;  Copie este archivo a la RAIZ de la USB (junto a las carpetas EFI/ y live/).
;  Se puede editar desde Windows con el Bloc de notas sin reconstruir la ISO.
; =====================================================================
[general]
; URL del flujo de Power Automate ("Cuando se recibe una solicitud HTTP").
; Tratela como credencial. Vacia = solo se guarda en la USB.
webhook_url = https://default9c26dae7ae0044a1b2063df04561be.9c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/69485697e04e4c35a8fcf13f049240d1/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=BBSqgVxtIJO31irfCMoThUzDSZ3kvjRTB3_J0EEJjYw

; Texto que se envia en el campo "hostname" del flujo (el equipo ya no tiene SO).
etiqueta_hostname = BORRADO-SEGURO

reintentos_webhook = 3

; Muestras de 64 KiB que se comparan antes/despues del borrado.
muestras_verificacion = 32

; si = exige cargador conectado en laptops antes de borrar.
requerir_corriente = si

; si = permite borrar discos externos conectados por USB (la USB de arranque nunca aparece).
permitir_usb_externos = no

; si = cuando un SSD no soporta ningun borrado por firmware, sobrescribe con ceros
;      (el certificado lo marca como PARCIAL). no = lo marca como FALLIDO.
sobrescribir_ssd_si_falla = no

; Opcional: clave secreta para firmar la huella del certificado con HMAC-SHA256.
clave_hmac =
